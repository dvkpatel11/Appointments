<div class="activity">
  {% for item in items %}
  <div class="activity__item" data-activity-id="{{ item.id }}">
    <div class="activity__icon activity__icon--{{ item.tone }}" aria-hidden="true">
      {% if item.tone == 'success' %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      {% elif item.tone == 'warning' %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      {% elif item.tone == 'error' %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      {% else %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {% endif %}
    </div>
    <div class="activity__body">
      <div class="activity__title">{{ item.title }}</div>
      {% if item.sub %}<div class="activity__sub">{{ item.sub }}</div>{% endif %}
    </div>
    <time class="activity__time" datetime="{{ item.iso }}">{{ item.relative }}</time>
  </div>
  {% endfor %}
</div>
