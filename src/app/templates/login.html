<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisaCtrl — Sign In</title>
    <link rel="stylesheet" href="/static/css/glass.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="login-page">
    <div class="login-card glass">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0071e3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <h1>VisaCtrl</h1>
        <p>Appointment Monitoring</p>
      </div>

      {% if error %}
      <div class="login-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <label class="input-label" for="password">Password</label>
        <input class="input" id="password" type="password" name="password" placeholder="Enter admin password" autofocus spellcheck="false" />
        <button type="submit" class="btn btn-primary mt-md" style="width:100%;justify-content:center;padding:10px">
          Sign In
        </button>
      </form>

      <p class="login-footer">Authorized access only</p>
    </div>
    <script>lucide.createIcons();</script>
  </body>
</html>
