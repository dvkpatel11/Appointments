# ─────────────────────────────────────────────────────────────────────────────
# VISA_CTRL — Google Cloud Build Pipeline
#
# Triggers on push → builds image → pushes to Artifact Registry → deploys to
# Cloud Run.
#
# ONE-TIME SETUP (run these in Cloud Shell or gcloud CLI):
# ─────────────────────────────────────────────────────────
# 1. Enable APIs:
#      gcloud services enable \
#        cloudbuild.googleapis.com \
#        run.googleapis.com \
#        secretmanager.googleapis.com \
#        artifactregistry.googleapis.com
#
# 2. Create Artifact Registry repository:
#      gcloud artifacts repositories create visa-ctrl \
#        --repository-format=docker \
#        --location=northamerica-northeast1 \
#        --description="VisaCtrl container images"
#
# 3. Create secrets in Secret Manager:
#      echo -n "your-secret-key"     | gcloud secrets create visa-ctrl-secret-key     --data-file=-
#      echo -n "your-admin-password" | gcloud secrets create visa-ctrl-admin-password  --data-file=-
#      echo -n "you@gmail.com"       | gcloud secrets create visa-ctrl-smtp-user       --data-file=-
#      echo -n "your-app-password"   | gcloud secrets create visa-ctrl-smtp-password   --data-file=-
#      echo -n "your-resend-key"     | gcloud secrets create visa-ctrl-resend-key      --data-file=-
#      echo -n "your-tg-token"       | gcloud secrets create visa-ctrl-telegram-token  --data-file=-
#      echo -n "your-tg-chat-id"     | gcloud secrets create visa-ctrl-telegram-chat   --data-file=-
#      echo -n "your-sentry-dsn"     | gcloud secrets create visa-ctrl-sentry-dsn      --data-file=-
#      echo -n "your-twilio-sid"     | gcloud secrets create visa-ctrl-twilio-sid      --data-file=-
#      echo -n "your-twilio-token"   | gcloud secrets create visa-ctrl-twilio-token    --data-file=-
#      echo -n "your-twilio-number"  | gcloud secrets create visa-ctrl-twilio-from     --data-file=-
#
# 4. Grant Cloud Build access to Secret Manager:
#      PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#
# 5. Connect this repo in Cloud Build → Triggers → Create Trigger.
#    Set branch to main (or your preferred branch).
# ─────────────────────────────────────────────────────────────────────────────

# ── Substitutions (override with --substitutions on gcloud builds submit) ─────
substitutions:
  _REGION: "northamerica-northeast1"
  _REPO: "visa-ctrl"
  _SERVICE: "visa-ctrl"

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:$COMMIT_SHA'
      - '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:latest'
      - '--cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:latest'
      - '.'

  # ── Step 2: Push both tags ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl'

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['push']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=3600'
      - '--concurrency=5'
      # ── Inject secrets from Secret Manager ──
      - >-
        --set-secrets=SECRET_KEY=visa-ctrl-secret-key:latest,ADMIN_PASSWORD=visa-ctrl-admin-password:latest,SMTP_USER=visa-ctrl-smtp-user:latest,SMTP_PASSWORD=visa-ctrl-smtp-password:latest,RESEND_API_KEY=visa-ctrl-resend-key:latest,TELEGRAM_BOT_TOKEN=visa-ctrl-telegram-token:latest,TELEGRAM_CHAT_ID=visa-ctrl-telegram-chat:latest,SENTRY_DSN=visa-ctrl-sentry-dsn:latest,TWILIO_ACCOUNT_SID=visa-ctrl-twilio-sid:latest,TWILIO_AUTH_TOKEN=visa-ctrl-twilio-token:latest,TWILIO_FROM_NUMBER=visa-ctrl-twilio-from:latest
      # ── Static env vars ──
      - '--set-env-vars=SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,FLASK_DEBUG=false'

# Images to store in the registry after the build
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/visa-ctrl:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
